let lang='ka',game='cs2',baseline=null;const $=id=>document.getElementById(id);
for(const [id,data] of [['cpu',cpus],['gpu',gpus]]){
 const input=$(id),list=$(id+'-options');let open=false;
 function close(){open=false;list.hidden=true;input.setAttribute('aria-expanded','false')}
 function show(filter=''){
  open=true;list.hidden=false;input.setAttribute('aria-expanded','true');list.replaceChildren();
  const names=Object.keys(data).filter(name=>name.toLowerCase().includes(filter.toLowerCase().trim()));
  names.forEach(name=>{const option=document.createElement('button');option.type='button';option.role='option';option.textContent=name;option.setAttribute('aria-selected',String(input.value===name));option.addEventListener('mousedown',e=>e.preventDefault());option.addEventListener('click',()=>{input.value=name;reset();close();input.focus();close()});option.addEventListener('keydown',e=>{if(e.key==='Escape'){close();input.focus();close()}if(e.key==='ArrowDown'){e.preventDefault();option.nextElementSibling?.focus()}if(e.key==='ArrowUp'){e.preventDefault();option.previousElementSibling?.focus()}});list.append(option)});

 }
 input.addEventListener('focus',()=>{input.select();show()});input.addEventListener('click',()=>{input.select();show()});

 document.addEventListener('pointerdown',e=>{if(!input.parentElement.contains(e.target))close()});input.parentElement.addEventListener('focusout',e=>{if(!input.parentElement.contains(e.relatedTarget))close()});
}
function localize(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=copy[lang][e.dataset.t]);document.documentElement.lang=lang;document.querySelectorAll('[data-lang]').forEach(e=>e.setAttribute('aria-pressed',e.dataset.lang===lang));$('preset').textContent=copy[lang].presets[game];if(!$('error').hidden)$('error').textContent=copy[lang].invalid;if(baseline)render()}
function reset(){$('results').hidden=true;baseline=null;$('error').hidden=true}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;localize()}));document.querySelectorAll('[data-game]').forEach(b=>b.addEventListener('click',()=>{game=b.dataset.game;document.querySelectorAll('[data-game]').forEach(e=>e.setAttribute('aria-pressed',e===b));reset();localize()}));$('theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
$('form').addEventListener('input',reset);$('form').addEventListener('change',reset);
function calculate(){const normalize=v=>v.toLowerCase().replace(/[^a-z0-9]/g,'');const resolve=(value,data)=>{const n=normalize(value);if(!n)return null;const exact=Object.keys(data).find(k=>normalize(k)===n);if(exact)return exact;const matches=Object.keys(data).filter(k=>normalize(k).includes(n));return matches.length===1?matches[0]:null};const cn=resolve($('cpu').value,cpus),gn=resolve($('gpu').value,gpus);const c=cpus[cn],g=gpus[gn];if(!c||!g){$('error').textContent=copy[lang].invalid;$('error').hidden=false;(!c?$('cpu'):$('gpu')).focus();return} $('cpu').value=cn;$('gpu').value=gn;const mem=Number($('ram').value),channel=$('channels').value;const memoryFactor=mem<=4?.45:mem<=6?.6:mem<=8?.78:mem<=12?.9:1;const channelFactor=channel==='single'?.85:channel==='unknown'?.92:1;const p={cs2:[250,280],valorant:[380,440],gta:[145,150],fortnite:[220,235]}[game],r={1080:1,1440:.72,2160:.4}[$('res').value];let center=Math.min(p[0]*c,p[1]*g*r);center*=memoryFactor*channelFactor;if(game==='gta')center=Math.min(center,180);baseline=[Math.max(10,Math.round(center*.7/5)*5),Math.round(center*1.2/5)*5];$('error').hidden=true;$('results').hidden=false;render();$('results').scrollIntoView({behavior:'auto',block:'start'});} $('calculate').addEventListener('click',calculate);$('form').addEventListener('submit',e=>{e.preventDefault();calculate()});
function render(){const uplift={basic:[.20,.25],advanced:[.35,.45],maximum:[.50,.55]}[$('package').value],gain=(uplift[0]+uplift[1])/2,fmt=a=>a[0]===a[1]?String(a[0]):a.join('–');$('before').textContent=fmt(baseline);$('after').textContent=fmt([Math.round(baseline[0]*(1+uplift[0])),Math.round(baseline[1]*(1+uplift[1]))]);$('summary').textContent={cs2:'Counter-Strike 2',valorant:'Valorant',gta:'GTA V Legacy',fortnite:'Fortnite'}[game];$('config').textContent=$('res').selectedOptions[0].text+' · '+$('ram').value+' GB · '+$('channels').selectedOptions[0].text+' · '+$('package').selectedOptions[0].text;$('bar-before').style.width=80/(1+gain)+'%';$('bar-after').style.width='80%'}localize();

 const select=$(id),parent=select.parentElement,wrapper=document.createElement('div');wrapper.className='custom-select';

 let items=[];function sync(){value.textContent=select.selectedOptions[0].text;items.forEach((item,i)=>{item.firstChild.textContent=select.options[i].text;const selected=i===select.selectedIndex;item.setAttribute('aria-selected',String(selected));item.querySelector('.tick').textContent=selected?'✓':''});const label=parent.querySelector('[data-t]');trigger.setAttribute('aria-label',(label?label.textContent:'')+': '+value.textContent)}
 function close(){menu.hidden=true;trigger.setAttribute('aria-expanded','false')}
 function open(){document.querySelectorAll('.select-menu').forEach(m=>{if(m!==menu){m.hidden=true;document.getElementById(m.id.replace('-menu','-trigger'))?.setAttribute('aria-expanded','false')}});sync();menu.hidden=false;trigger.setAttribute('aria-expanded','true');items[select.selectedIndex]?.scrollIntoView({block:'nearest'})}
 [...select.options].forEach((option,i)=>{const item=document.createElement('button');item.type='button';item.className='select-option';item.role='option';item.innerHTML='<span></span><span class="tick" aria-hidden="true"></span>';item.firstChild.textContent=option.text;item.addEventListener('click',()=>{select.selectedIndex=i;select.dispatchEvent(new Event('change',{bubbles:true}));sync();close();trigger.focus()});item.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();close();trigger.focus()}if(e.key==='ArrowDown'){e.preventDefault();items[(i+1)%items.length].focus()}if(e.key==='ArrowUp'){e.preventDefault();items[(i+items.length-1)%items.length].focus()}if(e.key==='Home'){e.preventDefault();items[0].focus()}if(e.key==='End'){e.preventDefault();items[items.length-1].focus()}});items.push(item);menu.append(item)});
 trigger.addEventListener('click',()=>menu.hidden?open():close());trigger.addEventListener('keydown',e=>{if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();open();items[e.key==='End'?items.length-1:e.key==='Home'?0:select.selectedIndex].focus()}if(e.key==='Escape')close()});
 document.addEventListener('pointerdown',e=>{if(!wrapper.contains(e.target))close()});wrapper.addEventListener('focusout',e=>{if(!wrapper.contains(e.relatedTarget))close()});
 select.hidden=true;select.tabIndex=-1;select.setAttribute('aria-hidden','true');wrapper.append(trigger,menu);parent.append(wrapper);sync();select.addEventListener('change',sync);new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
}
